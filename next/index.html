<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true"><path d="M24 4 31 24 24 44 17 24Z" fill="currentColor"/><circle cx="24" cy="24" r="4.5" fill="var(--bg)"/></svg>
        </span>
        <span class="brand-text"><strong>Compass</strong><small>GNDEC</small></span>
      </div>

      <nav class="side-nav" id="side-nav">
        <button type="button" class="nav-item is-active" data-route="today">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Today</span>
        </button>
        <button type="button" class="nav-item" data-route="timetable">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 2v4m8-4v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Timetable</span>

        <button type="button" class="nav-item" data-route="rooms">
          <span class="nav-icon" aria-hidden="true">

          <span class="nav-label">Rooms</span>
        </button>
        <button type="button" class="nav-item" data-route="teachers">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="7" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 21c0-3.8 3.1-6.2 7-6.2s7 2.4 7 6.2M19 3l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Teachers</span>
        </button>
        <button type="button" class="nav-item" data-route="ask">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3l2.2 5.4L20 10.5l-4.4 3.7 1.3 5.8L12 16.9 7.1 20l1.3-5.8L4 10.5l5.8-2.1L12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </span>
          <span class="nav-label">Ask</span>
        </button>
        <button type="button" class="nav-item" data-route="notices">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M9 12h7M9 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Notices</span>
        </button>
        <button type="button" class="nav-item" data-route="papers">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M10 13h6M10 17h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Papers</span>
        </button>
        <button type="button" class="nav-item" data-route="syllabus">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <span class="nav-label">Syllabus</span>
        </button>
        <button type="button" class="nav-item" data-route="calendar">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4m8-4v4M7 14h3m4 0h3M7 18h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Calendar</span>
        </button>
        <button type="button" class="nav-item" data-route="directory">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 20c0-2.4-1-4-2.7-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Directory</span>
        </button>
        <button type="button" class="nav-item" data-route="compare">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 4v16M5 8 2 12l3 4M19 8l3 4-3 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="nav-label">Compare</span>
        </button>
        <button type="button" class="nav-item" data-route="settings">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="legacy-card" id="open-legacy-side" hidden>
          <span class="legacy-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span><strong>Legacy build</strong><small>Current app, frozen</small></span>
          <span class="legacy-card-arrow" aria-hidden="true">↗</span>
        </button>
        <button type="button" class="install-card" id="install-side" hidden>
          <span aria-hidden="true">⤓</span> Install Compass
        </button>
        <p class="build-line" id="build-line">v2.0.0 · stable</p>
      </div>
    </aside>

    <header class="topbar" id="topbar">
      <button type="button" class="icon-button menu-button" id="menu-button" aria-label="Open navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <span class="eyebrow" id="topbar-eyebrow">Verified college data</span>
        <h1 id="topbar-title">Today</h1>
      </div>
      <time class="topbar-clock" id="topbar-clock" aria-label="Current date and time in India">
        <span id="topbar-clock-date">GNDEC time</span>
        <strong id="topbar-clock-time">--:--</strong>
      </time>
      <div class="topbar-actions">
        <button type="button" class="icon-button" id="install-button" aria-label="Install Compass" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-button" id="command-button" aria-label="Search and commands (Ctrl+K)" title="Ctrl/Cmd+K">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="avatar-button" id="avatar-button" aria-label="Open profile settings">
          <span id="avatar-initials">G</span>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1" role="main">
      <div class="boot-skeleton" id="boot-skeleton" aria-hidden="true">
        <div class="skeleton skeleton-hero"></div>
        <div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <div class="command-palette" id="command-palette" role="dialog" aria-modal="true" aria-label="Search and commands" hidden>
    <div class="command-box">
      <div class="command-input-row">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="search" id="command-input" placeholder="Search pages, settings and actions…" autocomplete="off" spellcheck="false" />
        <kbd>Esc</kbd>
      </div>
      <div class="command-results" id="command-results"></div>
      <div class="command-hint">↑ ↓ to move · Enter to open · Ctrl/Cmd+K anywhere</div>
    </div>
  </div>

  <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>

  <div class="update-banner" id="update-banner" hidden>
    <span>A newer Compass build is ready.</span>
    <button type="button" id="update-reload">Reload</button>
    <button type="button" class="icon-button" id="update-dismiss" aria-label="Dismiss">✕</button>
  </div>

  <noscript>
    <div class="noscript">
      <p><strong>Compass Next needs JavaScript for the live timetable engine.</strong></p>
      <p>The verified timetable is also available as static pages:</p>
      <p><a href="/college/">GNDEC timetable directory</a> · <a href="/college/exam-datesheet/">Exam datesheet</a> · <a href="/timetable?section=CEA">CEA timetable</a></p>
      <p>The legacy build remains available at the current GNDEC Compass URL.</p>
    </div>
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
