name: Next live verification

# Read-only check that the official GNDEC release still parses, that the frozen
# legacy origin still serves verified sources, and that the deployed Next
# Worker answers. This workflow never deploys and never writes timetable data.

on:
  schedule:
    - cron: "15 2 * * *" # 07:45 IST daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEGACY_ORIGIN: https://gndec-compass.koush3069.workers.dev
      NEXT_ORIGIN: https://gndec-compass-next.koush3069.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify official sources and the deployed Worker
        id: verify
        run: node scripts/verify-next-live.mjs

      - name: Verify the live app shell and SEO endpoints
        run: |
          set -euo pipefail
          base="$NEXT_ORIGIN"
          check() {
            local url="$1" expect="$2"
            local body
            body="$(curl -fsS --retry 3 --max-time 30 "$url")"
            # Use a shell substring check instead of `echo | grep -q`: with
            # pipefail, grep can exit early on large HTML and make echo fail
            # with SIGPIPE even when the expected text is present.
            [[ "$body" == *"$expect"* ]] || { echo "FAIL $url missing: $expect"; exit 1; }
            echo "OK $url"
          }
          check "$base/" "GNDEC Compass"
          check "$base/robots.txt" "Sitemap:"
          check "$base/sitemap.xml" "<urlset"
          check "$base/college/" "GNDEC Timetable Directory"
          check "$base/college/section/cea/" "CEA Timetable"

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Next live verification failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled verification of the official GNDEC release or the deployed Compass Next Worker failed.\n\nRun: ${run}\n\nNo data was changed and no deployment was attempted. Check the frozen legacy origin, the official FET export and the Worker health endpoint.`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "next-verify"
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["next-verify"]
              });
            }
