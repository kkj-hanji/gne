name: Next CI

on:
  push:
    paths:
      - "next/**"
      - "src/next-*.js"
      - "test/next-*.mjs"
      - "scripts/build-next-*.mjs"
      - "scripts/probe-next-ask.mjs"
      - "scripts/verify-next-live.mjs"
      - "wrangler.next.jsonc"
      - "wrangler.legacy.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/next-ci.yml"
  pull_request:
    paths:
      - "next/**"
      - "src/next-*.js"
      - "test/next-*.mjs"
      - "scripts/build-next-*.mjs"
      - "wrangler.next.jsonc"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and dry-run deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Regenerate the SEO directory from the current release
        run: npm run build:seo
        env:
          PUBLIC_ORIGIN: https://gndec-compass-next.koush3069.workers.dev

      - name: SEO contract tests
        run: node --test test/next-seo.test.mjs

      - name: Ask Compass multilingual probe
        run: npm run probe:next

      - name: Worker dry-run bundle
        run: npx wrangler deploy --dry-run -c wrangler.next.jsonc

      - name: Report generated SEO size
        run: |
          echo "pages: $(find next/college -name index.html | wc -l)"
          echo "sitemap urls: $(grep -c '<loc>' next/sitemap.xml)"
