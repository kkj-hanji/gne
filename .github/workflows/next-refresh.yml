name: Next data refresh

# Rebuilds the crawlable timetable directory from the live verified release,
# commits any real change, then deploys the new Worker when Cloudflare secrets
# are configured. If no change is found, nothing is committed and nothing is
# deployed, so the site cannot churn for no reason.

on:
  schedule:
    # 02:10 IST every day (20:40 UTC the previous day).
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_ORIGIN: https://gndec-compass-next.koush3069.workers.dev
      LEGACY_ORIGIN: https://gndec-compass.koush3069.workers.dev
      # Empty when the secret is not configured; the deploy step then skips.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the live release is complete
        run: node scripts/verify-next-live.mjs

      - name: Refresh official data bundles
        run: |
          node scripts/build-campus.mjs
          node scripts/build-datesheet.mjs
          node scripts/build-directory-indexes.mjs
          node scripts/build-syllabus-index.mjs
          node scripts/build-papers.mjs --write

      - name: Rebuild static SEO pages
        run: npm run build:seo

      - name: Bundle the verified timetable for first-load and outage fallback
        run: npm run build:next-bundle

      - name: Test the regenerated directory
        run: |
          node --test test/next-seo.test.mjs
          node --test test/next-engine.test.mjs test/next-language.test.mjs

      - name: Commit changed pages
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- next/college next/data next/sitemap.xml next/robots.txt next/icons/og-cover.svg public/data src/data)" ]; then
            echo "No timetable change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "gndec-compass-bot"
          git config user.email "gndec-compass-bot@users.noreply.github.com"
          git add next/college next/data next/sitemap.xml next/robots.txt next/icons/og-cover.svg public/data src/data
          git commit -m "chore(next): refresh official data and timetable directory"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the new Worker
        if: steps.commit.outputs.changed == 'true' && env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.next.jsonc
